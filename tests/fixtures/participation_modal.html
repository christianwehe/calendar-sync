<!-- The HTML fragment returned by /events/ajaxgetparticipation, trimmed to
     the structure the parser relies on. Section headings are language
     dependent; the numeric collapse target is not. -->
<div class="participation-list">
  <h4 class="participation-list-header" data-target="#99-parti-collapse">
    Noch nicht zu/abgesagt
    <span class="pull-right participation-list-header-number">1</span>
  </h4>
  <div class="collapse in" id="99-parti-collapse">
    <div class="participation-list-user">
      <a class="participation-list-user-photo" href="/user/view?id=1003"></a>
      <div class="participation-list-user-infos">
        <div class="participation-list-user-name">Second Player</div>
      </div>
    </div>
  </div>
</div>

        <div class="participation-list-user-name">Parent (Child) Playerson</div>
      </div>
    </div>
    <!-- Guest players have no account, and the "add a guest" row is not a person at all. -->
    <div class="participation-list-user" id="create-guest-panel">
      <div class="participation-list-user-name">Gastspieler hinzufügen</div>
    </div>
  </div>
</div>
